# The PostgreSQL servers for the tests. Start both with
# `docker compose up -d --wait` and stop both with `docker compose down`.
# They keep no data: each start gives an empty database.
#
# The host ports are 5438 and 5439, so the tests do not use a PostgreSQL
# server that already listens on 5432. Give the ports to the tests with the
# environment variables PGPORT (5438) and DREAM_POSTGRES_CLIENT_SSL_PGPORT
# (5439).

name: dream_postgres_client

services:
  # The server for most tests. SSL is off.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 30

  # The server for the SSL tests. SSL is on, with the server certificate of
  # test/fixtures/ssl: the test CA signed it, and its only name is
  # `localhost`. So `localhost` matches the certificate and `127.0.0.1`
  # does not.
  postgres-ssl:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5439:5432"
    volumes:
      - ./test/fixtures/ssl:/certs:ro
    # PostgreSQL refuses a key file that the user `postgres` does not own,
    # or that others can read. A mounted file has the owner and the mode of
    # the checkout, so the entrypoint copies the files first.
    entrypoint:
      - sh
      - -c
      - >-
        install -o postgres -g postgres -m 0600 /certs/server.key /var/lib/postgresql/server.key &&
        install -o postgres -g postgres -m 0644 /certs/server.crt /var/lib/postgresql/server.crt &&
        exec docker-entrypoint.sh postgres
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/server.crt
        -c ssl_key_file=/var/lib/postgresql/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
