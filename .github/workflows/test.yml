name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # container: ubuntu:20.04
    # The PostgreSQL servers come from docker-compose.yml, not from a service
    # container: the SSL server needs the certificates of test/fixtures/ssl,
    # and a service container starts before the checkout.
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          # gleam_stdlib 1.2.0 of manifest.toml needs Gleam 1.14.0 or newer.
          # `gleam format` output can change between Gleam versions, so the
          # format check uses this exact version.
          gleam-version: "1.14.0"
          rebar3-version: "3"
          # ImageOS: ubuntu20
      - run: docker compose up -d --wait
      - run: gleam build
      - run: ./test/reset_db.sh
        env:
          PGHOST: localhost
          PGPORT: 5438
          PGPASSWORD: postgres
          PGUSER: postgres
      - run: gleam test
        env:
          PGPORT: 5438
          DREAM_POSTGRES_CLIENT_SSL_PGPORT: 5439
      - run: gleam format --check src test
